plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        url 'https://harleyoconnor.com/maven'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dir("libs")
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    accessTransformers {
        file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll(
                    '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(ProcessResources).configureEach {
    // Both maple spiles have hand-authored block state definitions -- a multipart dispatch over
    // facing, fill level and syrup stage that Dynamic Trees' generators cannot express. Data
    // generation still emits a plain definition for them so that vanilla's "every block needs a
    // model" check passes; EXCLUDE keeps the first copy on the path, which is src/main/resources,
    // so the hand-authored one wins.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    //NeoForge
    implementation "net.neoforged:neoforge:${neo_version}"

    //DynamicTrees
    implementation "com.dtteam.dynamictrees:dynamictrees-neoforge-${minecraft_version}:${dt_version}"
    //implementation "com.dtteam.dynamictreesplus:DynamicTreesPlus:${dtplus_version}"

    //DynmaicTrees Tools/Utilities
    implementation "curse.maven:jade-324717:7903350"
    runtimeOnly "curse.maven:jei-238222:7904641"
    runtimeOnly "maven.modrinth:cc-tweaked:v79rEtLq"
    runtimeOnly "curse.maven:tagtooltips-899941:7857745"

    //Other
    //implementation "curse.maven:template-projectid:fileid"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.jar {
    manifest {
        archiveFileName.set("${project.name}-neoforge-${minecraft_version}-${project.version}.jar")
    }
}
